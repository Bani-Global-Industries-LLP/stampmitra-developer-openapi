name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate OpenAPI 3.1 document
        run: npm run validate
      - name: Fixtures conform to the spec; validator, webhook and retry vectors self-check
        run: npm run check
      - name: Postman collection is up to date with openapi.json
        run: |
          node scripts/build-postman.mjs --out "$RUNNER_TEMP/postman.json"
          diff -u postman.json "$RUNNER_TEMP/postman.json"
      - name: Operation fixtures are up to date with openapi.json
        run: |
          node scripts/build-fixtures.mjs
          git diff --exit-code -- fixtures/operations fixtures/webhooks
      - name: Mock server smoke test
        run: npm run test:mock
      - name: Mock server conformance (every fixture replayed, byte-equal)
        run: npm run test:conformance
      - name: Sync guard (never overwrite a newer spec with an older one)
        run: npm run test:sync
      - name: Webhook vectors are up to date
        run: |
          node scripts/build-webhook-vectors.mjs
          git diff --exit-code -- fixtures/webhook-signatures.json
      - name: Dependency audit
        run: npm audit --audit-level=high
